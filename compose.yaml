name: pheme

services:
  postgres:
    # PostgreSQL 18.6 on Debian trixie, pinned by multi-arch index digest (see docs/versions.md).
    # Debian rather than Alpine: Alpine's C library sorts and handles locales differently.
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PHEME_APP_DB_PASSWORD: ${PHEME_APP_DB_PASSWORD:?set PHEME_APP_DB_PASSWORD in .env}
    ports:
      # Loopback only: the database is not reachable from other machines on the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images declare VOLUME /var/lib/postgresql and keep PGDATA in
      # /var/lib/postgresql/18/docker; the pre-18 /var/lib/postgresql/data path is not used.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP rather than the Unix socket: during first-time initialisation the temporary
      # server listens on the socket only, so this cannot pass before the init scripts finish.
      test: ["CMD-SHELL", 'pg_isready --host=127.0.0.1 --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
      start_interval: 1s

volumes:
  pgdata:
